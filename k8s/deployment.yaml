apiVersion: apps/v1
kind: Deployment
metadata:
  name: disaster-tweet-classifier
  labels:
    app: disaster-tweet-classifier
spec:
  replicas: 2                          # 2 pods running for high availability
  selector:
    matchLabels:
      app: disaster-tweet-classifier
  template:
    metadata:
      labels:
        app: disaster-tweet-classifier
    spec:
      containers:
      - name: classifier
        image: rohanxmudrale28/disaster-tweet-classifier:latest
        imagePullPolicy: Always        # Always pull fresh image from Docker Hub
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5
